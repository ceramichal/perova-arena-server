<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10131a"><link rel="manifest" href="manifest.webmanifest"><title>Péřová Aréna Online</title><style>*{box-sizing:border-box}html,body{margin:0;background:#10131a;color:#f3f6ff;font:16px system-ui;height:100%;overflow:hidden}#game{width:100vw;height:100dvh;display:block;touch-action:none}#panel{position:absolute;inset:0;display:grid;place-items:center;background:#090d14dc}.card{background:#1a2230;padding:22px;border-radius:18px;width:min(90%,430px);box-shadow:0 15px 50px #0009}h1{margin:0 0 8px}.muted{color:#aebbd0;font-size:14px}button{border:0;border-radius:12px;padding:14px 18px;font-weight:800;background:#eaf7ff;color:#111a26;width:100%;margin-top:14px}#status{position:absolute;top:10px;left:0;right:0;text-align:center;font-weight:800;text-shadow:0 2px 5px #000}#controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.joy,.fire{pointer-events:auto;border:2px solid #ffffff55;background:#ffffff18;border-radius:50%;display:grid;place-items:center;width:100px;height:100px;font-weight:800;touch-action:none}.fire{width:82px;height:82px;background:#ff426344}#panel[hidden]{display:none}</style></head><body><canvas id="game" width="960" height="540"></canvas><div id="status">PÉŘOVÁ ARÉNA • ONLINE</div><div id="controls"><div class="joy" id="joy">POHYB</div><div class="fire" id="fire">PALBA</div></div><div id="panel"><div class="card"><h1>Péřová Aréna Online</h1><p class="muted">Rychlá mobilní přestřelka 1 na 1. Připoj se k náhodnému soupeři. Otoč telefon na šířku.</p><div id="msg">Připraveno k hledání soupeře.</div><button id="play">NAJÍT SOUPEŘE</button></div></div><script>
const c=document.querySelector('#game'),x=c.getContext('2d'),W=960,H=540;let ws,me=0,connected=false,peer={x:800,y:270,ang:3.14,fire:false},p={x:160,y:270,ang:0,fire:false},bullets=[],score=[0,0],keys={u:0,d:0,l:0,r:0,fire:0},remote={},last=performance.now(),joyOn=false,joyVec={x:0,y:0};const msg=document.querySelector('#msg'),panel=document.querySelector('#panel');
function connect(){document.querySelector('#play').disabled=true;msg.textContent='Hledám soupeře…';const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(proto+'://'+location.host);ws.onopen=()=>{};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='waiting')msg.textContent='Čekám na druhého hráče…';if(m.type==='matched'){me=m.player;connected=true;msg.textContent='Soupeř nalezen!';panel.hidden=true;reset()}if(m.type==='input')remote=m.input;if(m.type==='restart')reset();if(m.type==='opponent-left'){connected=false;panel.hidden=false;msg.textContent='Soupeř se odpojil.';document.querySelector('#play').disabled=false}};ws.onerror=()=>{msg.textContent='Nepodařilo se připojit. Zkontroluj server.';document.querySelector('#play').disabled=false};ws.onclose=()=>{connected=false}}document.querySelector('#play').onclick=connect;
function reset(){p={x:me===0?150:810,y:270,ang:me===0?0:3.14,fire:false};peer={x:me===0?810:150,y:270,ang:me===0?3.14:0,fire:false};score=[0,0];bullets=[]}
function input(){let i={...keys};if(joyOn){i.l=joyVec.x<-.25;i.r=joyVec.x>.25;i.u=joyVec.y<-.25;i.d=joyVec.y>.25}if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'input',input:i}));return i}
function stepPlayer(q,i,dt){let dx=(i.r?1:0)-(i.l?1:0),dy=(i.d?1:0)-(i.u?1:0),n=Math.hypot(dx,dy)||1;dx/=n;dy/=n;q.x=Math.max(24,Math.min(W-24,q.x+dx*220*dt));q.y=Math.max(60,Math.min(H-24,q.y+dy*220*dt));if(dx||dy)q.ang=Math.atan2(dy,dx);q.cd=(q.cd||0)-dt;if(i.fire&&q.cd<=0){q.cd=.28;bullets.push({x:q.x+Math.cos(q.ang)*28,y:q.y+Math.sin(q.ang)*28,vx:Math.cos(q.ang)*500,vy:Math.sin(q.ang)*500,owner:q===p?me:1-me,t:1.5})}}
function draw(){x.fillStyle='#151c26';x.fillRect(0,0,W,H);x.strokeStyle='#ffffff10';for(let a=0;a<W;a+=40){x.beginPath();x.moveTo(a,40);x.lineTo(a,H);x.stroke()}for(let a=40;a<H;a+=40){x.beginPath();x.moveTo(0,a);x.lineTo(W,a);x.stroke()}for(const o of [[270,150,90,30],[600,350,90,30],[430,240,90,60]]){x.fillStyle='#344150';x.fillRect(...o)}for(const b of bullets){x.fillStyle='#fff';x.beginPath();x.arc(b.x,b.y,5,0,7);x.fill()}drawP(p,me);drawP(peer,1-me);x.fillStyle='#fff';x.font='bold 24px system-ui';x.textAlign='center';x.fillText(score[0]+'  :  '+score[1],W/2,35);}
function drawP(q,id){x.save();x.translate(q.x,q.y);x.rotate(q.ang);x.fillStyle=id?'#ff779e':'#61d9ff';x.beginPath();x.roundRect(-22,-17,44,34,12);x.fill();x.fillStyle='#eaf2ff';x.fillRect(10,-4,25,8);x.restore()}
function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(connected){let i=input();stepPlayer(p,i,dt);stepPlayer(peer,remote,dt);for(let b=bullets.length-1;b>=0;b--){let q=bullets[b];q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt;if(q.x<0||q.x>W||q.y<40||q.y>H||q.t<=0){bullets.splice(b,1);continue}let target=q.owner===me?peer:p;if(Math.hypot(q.x-target.x,q.y-target.y)<22){score[q.owner]++;bullets.splice(b,1);target.x=q.owner===me?(me===0?810:150):(me===0?150:810);target.y=270;if(score[q.owner]>=10){msg.textContent='Hráč '+(q.owner+1)+' vyhrál!';panel.hidden=false;document.querySelector('#play').disabled=false;document.querySelector('#play').textContent='HRÁT ZNOVU';connected=false;ws.send(JSON.stringify({type:'restart'}))}}}}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
const joy=document.querySelector('#joy');joy.addEventListener('pointerdown',e=>{joyOn=true;joy.setPointerCapture(e.pointerId);moveJoy(e)});joy.addEventListener('pointermove',e=>{if(joyOn)moveJoy(e)});joy.addEventListener('pointerup',()=>{joyOn=false;joyVec={x:0,y:0}});function moveJoy(e){let r=joy.getBoundingClientRect();joyVec={x:Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width/2))),y:Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(r.height/2)))}}const fire=document.querySelector('#fire');fire.addEventListener('pointerdown',e=>{keys.fire=1;fire.setPointerCapture(e.pointerId)});fire.addEventListener('pointerup',()=>keys.fire=0);addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')keys.u=1;if(e.key==='s'||e.key==='ArrowDown')keys.d=1;if(e.key==='a'||e.key==='ArrowLeft')keys.l=1;if(e.key==='d'||e.key==='ArrowRight')keys.r=1;if(e.key===' ')keys.fire=1});addEventListener('keyup',e=>{if(e.key==='w'||e.key==='ArrowUp')keys.u=0;if(e.key==='s'||e.key==='ArrowDown')keys.d=0;if(e.key==='a'||e.key==='ArrowLeft')keys.l=0;if(e.key==='d'||e.key==='ArrowRight')keys.r=0;if(e.key===' ')keys.fire=0});</script></body></html>
